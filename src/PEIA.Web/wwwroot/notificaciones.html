<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEIA — Notificaciones</title>
  <meta name="description" content="Panel de notificaciones del sistema PEIA" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/inicio.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/notificaciones.css" />
</head>
<body>
  <div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg width="26" height="26" viewBox="0 0 28 28" fill="none">
            <rect x="2" y="8" width="10" height="10" rx="2" fill="#fff"/>
            <rect x="16" y="2" width="10" height="10" rx="2" fill="#fff"/>
            <rect x="10" y="16" width="10" height="10" rx="2" fill="rgba(255,255,255,.6)"/>
          </svg>
        </div>
        <span>PEIA</span>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li><a href="inicio.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Inicio</a></li>
          <li><a href="inventario.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg> Inventario</a></li>
          <li><a href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1" ry="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="12" y2="16"/></svg> Pedidos</a></li>
          <li><a href="reportes.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> Reportes</a></li>
          <li><a href="roles.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Roles</a></li>
          <li><a href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Cámaras</a></li>
          <li class="active"><a href="notificaciones.html" class="has-badge"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> Notificaciones <span class="badge" id="navBadge">3</span></a></li>
          <li><a href="usuarios.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Usuarios</a></li>
          <li><a href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg> Configuración</a></li>
          <li><a href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> Bitácora</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <button class="btn-logout" id="btnLogout"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Cerrar sesión</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <div class="warehouse-selector">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span id="activeCentro">Bodega Norte</span>
            <svg class="chevron-sm" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            <div class="warehouse-dropdown" id="warehouseDropdown">
              <button class="warehouse-opt active" data-id="norte">Bodega Norte</button>
              <button class="warehouse-opt" data-id="sur">Bodega Sur</button>
            </div>
          </div>
        </div>
        <div class="topbar-right">
          <div class="user-menu" id="userMenu">
            <div class="avatar" id="userAvatar">JM</div>
            <span class="user-name" id="userName">Jennifer Muñoz</span>
            <svg class="chevron-sm" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
      </header>

      <div class="page-content">
        <div class="page-header">
          <h1>Notificaciones</h1>
          <p>Centro de alertas y notificaciones del sistema</p>
        </div>

        <!-- Action bar -->
        <div class="action-bar">
          <div class="action-bar-left">
            <button class="tab-btn active" data-filter="todas">Todas</button>
            <button class="tab-btn" data-filter="no-leidas">No leídas</button>
            <button class="tab-btn" data-filter="stock">Stock</button>
            <button class="tab-btn" data-filter="sla">SLA</button>
            <button class="tab-btn" data-filter="pedido">Pedidos</button>
            <button class="tab-btn" data-filter="camara">Cámaras</button>
          </div>
          <div class="action-bar-right">
            <button class="btn btn-secondary" id="btnMarkAll">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
              Marcar todas como leídas
            </button>
          </div>
        </div>

        <!-- Notifications list -->
        <div class="notif-list" id="notifList"></div>
      </div>
    </main>
  </div>

  <script src="js/notificaciones.js"></script>
</body>
</html>
