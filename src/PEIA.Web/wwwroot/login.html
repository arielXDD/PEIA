<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEIA — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-wrapper">

    <!-- Panel izquierdo: formulario -->
    <div class="login-panel">
      <div class="login-content">
        <div class="brand">
          <div class="brand-icon">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="8" width="10" height="10" rx="2" fill="#1d4ed8"/>
              <rect x="16" y="2" width="10" height="10" rx="2" fill="#1d4ed8"/>
              <rect x="10" y="16" width="10" height="10" rx="2" fill="#3b82f6"/>
            </svg>
          </div>
          <span class="brand-name">PEIA</span>
        </div>

        <div class="login-header">
          <h1>Plataforma Empresarial<br>Inteligente para Almacenes</h1>
          <p>Inicia sesión para continuar</p>
        </div>

        <form class="login-form" id="loginForm">
          <div class="form-group">
            <label for="email">Usuario o correo</label>
            <input
              type="text"
              id="email"
              name="email"
              placeholder="ejemplo@empresa.com"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••••"
                autocomplete="current-password"
                required
              />
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-label" for="remember">
              <input type="checkbox" id="remember" name="remember" checked />
              <span class="checkmark"></span>
              Recordarme
            </label>
            <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="btn-login" id="btnLogin">
            <span class="btn-text">Iniciar sesión</span>
            <span class="btn-spinner" id="btnSpinner" style="display:none;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="12" cy="12" r="10" stroke-opacity="0.3"/>
                <path d="M12 2a10 10 0 0 1 10 10"/>
              </svg>
            </span>
          </button>

          <div class="login-error" id="loginError" style="display:none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="loginErrorText">Usuario o contraseña incorrectos.</span>
          </div>
        </form>

        <footer class="login-footer">
          <p>© 2025 PEIA. Todos los derechos reservados.</p>
        </footer>
      </div>
    </div>

    <!-- Panel derecho: imagen de fondo de almacén -->
    <div class="login-hero" aria-hidden="true">
      <div class="hero-overlay"></div>
    </div>

  </div>

  <script src="js/login.js"></script>
</body>
</html>
